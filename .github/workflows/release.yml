name: Release APK

# Пуш тега вида v0.1.0 собирает release-APK и публикует его в GitHub Releases.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/EnglishVoiceTutor-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/EnglishVoiceTutor-${{ github.ref_name }}.apk
          body: |
            Офлайн голосовой репетитор английского под Android.

            **Установка:** скачайте `.apk` ниже на Android-устройство (Android 8.0+, реальное устройство с микрофоном и GPU) и установите, разрешив установку из неизвестных источников.

            При первом запуске приложение докачает модели (LLM и STT) — нужна сеть один раз. Подробнее — в README.

            > APK подписан debug-ключом (первый релиз). Установка «поверх» из будущих релизов с другим ключом может потребовать переустановку.
